"<!DOCTYPE html>\n<html xmlns:th=\"http://www.thymeleaf.org\">\n<head>\n    <title>Add Student</title>\n</head>\n<body>\n<h1>Add Student</h1>\n<form action=\"/students\" method=\"post\" th:object=\"${student}\">\n    <label for=\"name\">Name:</label>\n    <input type=\"text\" id=\"name\" name=\"name\" th:field=\"*{name}\" required>\n    <br>\n    <label for=\"classStudied\">Class Studied:</label>\n    <input type=\"text\" id=\"classStudied\" name=\"classStudied\" th:field=\"*{classStudied}\" required>\n    <br>\n    <label for=\"age\">Age:</label>\n    <input type=\"number\" id=\"age\" name=\"age\" th:field=\"*{age}\" required>\n    <br>\n    <button type=\"submit\">Save</button>\n</form>\n<a href=\"/students\">Back to Student List</a>\n</body>\n</html>"
